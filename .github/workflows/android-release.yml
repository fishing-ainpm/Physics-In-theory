name: Android release

# Builds the APK and publishes it as a GitHub release.
#  - Push a tag like v1.0.0, or
#  - run it by hand from the Actions tab (enter a version).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build web assets and sync Android project
        run: npm run android:sync

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; signing with a debug key."
            echo "SIGNED_WITH=debug key (add release signing secrets for upgradable builds)" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/PhysicsInTheory-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: PhysicsInTheory-*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          cat > notes.md <<NOTES
          Physics in Theory ${VERSION} for Android (7.0 and newer).

          Six offline physics simulations: projectile motion, simple pendulum, mass on a spring, 1D collisions, orbital motion and wave interference.

          **Install:** download \`PhysicsInTheory-${VERSION}.apk\` on your phone, open it, and allow installing from this source when Android asks.

          Signed with: ${SIGNED_WITH}.
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" PhysicsInTheory-*.apk --clobber
          else
            gh release create "$TAG" PhysicsInTheory-*.apk \
              --target "$GITHUB_SHA" --title "Physics in Theory $VERSION" --notes-file notes.md
          fi
